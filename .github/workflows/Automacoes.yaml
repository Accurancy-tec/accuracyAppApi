name: Automações (cotações e aportes recorrentes)

on:
  schedule:
    # 21:00 UTC = 18:00 em Brasília, depois do fechamento da B3,
    # então a cotação gravada é o fechamento do dia
    - cron: "0 21 * * *"

  workflow_dispatch:

# Nunca duas rodadas ao mesmo tempo
concurrency:
  group: automacoes-api
  cancel-in-progress: false

jobs:
  executar:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Executar automações
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          # --fail-with-body: HTTP 401/500 deixa de passar como "verde"
          # --retry: cobre o servidor acordando (cold start). Repetir é seguro,
          #          o endpoint trava a linha no banco e não duplica aporte
          curl --silent --show-error --fail-with-body \
            --max-time 180 \
            --retry 3 --retry-delay 20 --retry-all-errors \
            -X POST \
            -H "X-Cron-Key: $CRON_SECRET" \
            -o resposta.json \
            "https://accuracyappapi.onrender.com/user/executarAutomacoes.php"

          cat resposta.json

          # Falha o workflow se algum ativo ou aporte deu erro
          jq -e '.sucesso == true' resposta.json > /dev/null